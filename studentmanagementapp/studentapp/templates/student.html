<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Học Sinh - Nhân Viên</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- Top Navigation / Action Bar (Matching your wireframe top tabs) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container py-2">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-mortarboard-fill me-2"></i>School Manager</a>
            <div class="d-flex gap-2">
                <a href="/api/v1/students" class="btn btn-outline-light active btn-sm px-3"><i class="bi bi-search me-1"></i> Tra Cứu</a>
                <a href="/api/v1/students/form" class="btn btn-primary btn-sm px-3"><i class="bi bi-person-plus-fill me-1"></i> Tiếp Nhận</a>
                <button class="btn btn-outline-success btn-sm px-3" data-bs-toggle="modal" data-bs-target="#importModal"><i class="bi bi-file-earmark-arrow-up-fill me-1"></i> Xuất/Nhập File</button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container my-4">

        <!-- Search & Filter Bar -->
        <div class="row mb-4">
            <div class="col-md-8 mx-auto">
                <div class="input-group shadow-sm">
                    <input type="text" id="search-input" class="form-control" placeholder="Tìm kiếm theo mã học sinh hoặc họ tên...">
                    <button class="btn btn-dark" type="button" onclick="loadStudents()"><i class="bi bi-search"></i> Tìm</button>
                </div>
            </div>
        </div>

        <!-- Student List Container (Rows matching your sketch) -->
        <div class="row justify-content-center">
            <div class="col-md-10" id="student-list-container">
                <!-- Dynamic Rows will be injected here -->
                <div class="text-center py-5 text-muted">Đang tải danh sách học sinh...</div>
            </div>
        </div>
    </div>

    <!-- Import Modal -->
    <div class="modal fade" id="importModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Import Danh Sách Học Sinh (SD04)</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="import-form">
                        <div class="mb-3">
                            <label for="excelFile" class="form-label">Chọn file Excel (.xlsx) hoặc CSV</label>
                            <input class="form-control" type="file" id="excelFile" accept=".xlsx, .xls, .csv" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Tải lên & Import</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function loadStudents(keyword = '') {
            const container = document.getElementById('student-list-container');
            try {
                const res = await fetch(`/api/v1/students?q=${encodeURIComponent(keyword)}`);
                const result = await res.json();

                if (result.success && result.data.items) {
                    const items = result.data.items;
                    if (items.length === 0) {
                        container.innerHTML = `<div class="alert alert-warning text-center">Không tìm thấy học sinh nào.</div>`;
                        return;
                    }

                    container.innerHTML = items.map(s => `
                        <div class="card mb-3 shadow-sm border-0 rounded-3">
                            <div class="card-body d-flex align-items-center py-3">
                                <!-- Left Avatar Circle (from your wireframe) -->
                                <div class="flex-shrink-0 me-3">
                                    <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 55px; height: 55px; font-size: 1.2rem;">
                                        ${s.full_name ? s.full_name.charAt(0).toUpperCase() : 'HS'}
                                    </div>
                                </div>
                                <!-- Right Info Area -->
                                <div class="flex-grow-1 row align-items-center">
                                    <div class="col-md-4">
                                        <h5 class="mb-1 fw-bold text-dark">${s.full_name}</h5>
                                        <span class="badge bg-secondary">Mã: ${s.student_code}</span>
                                    </div>
                                    <div class="col-md-4 text-muted small">
                                        <div><i class="bi bi-calendar-event me-1"></i> Ngày sinh: ${s.date_of_birth || 'N/A'}</div>
                                        <div><i class="bi bi-gender-ambiguous me-1"></i> Giới tính: ${s.gender || 'N/A'}</div>
                                    </div>
                                    <div class="col-md-2">
                                        <span class="badge bg-success">${s.status || 'DANG_HOC'}</span>
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <a href="/api/v1/students/${s.id}/print" class="btn btn-outline-primary btn-sm" title="In hồ sơ"><i class="bi bi-printer"></i></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                container.innerHTML = `<div class="alert alert-danger text-center">Lỗi tải dữ liệu từ máy chủ.</div>`;
            }
        }

        // Trigger search on typing
        document.getElementById('search-input').addEventListener('input', function(e) {
            loadStudents(e.target.value);
        });

        // Initial load
        loadStudents();
    </script>
</body>
</html>
