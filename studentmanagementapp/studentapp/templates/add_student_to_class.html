{% extends 'layout/base.html' %}

{% block title %}Phân bổ Học sinh vào Lớp{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow border-0 rounded-3">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Phân bổ Học sinh vào Lớp</h4>
                </div>
                <div class="card-body p-4">
                    <form id="addStudentToClassForm">

                        <!-- Dropdown Chọn Lớp Học -->
                        <div class="mb-3">
                            <label for="class_id" class="form-label fw-bold">Chọn Lớp học</label>
                            <select class="form-select" id="class_id" name="class_id" required>
                                <option value="">-- Đang tải danh sách lớp học... --</option>
                            </select>
                        </div>

                        <!-- Dropdown Chọn Học Sinh -->
                        <div class="mb-3">
                            <label for="student_id" class="form-label fw-bold">Chọn Học sinh</label>
                            <select class="form-select" id="student_id" name="student_id" required>
                                <option value="">-- Đang tải danh sách học sinh... --</option>
                            </select>
                        </div>

                        <!-- Năm học ID -->
                        <div class="mb-3">
                            <label for="academic_year_id" class="form-label fw-bold">Năm học ID</label>
                            <input type="number" class="form-control" id="academic_year_id" name="academic_year_id" value="1" required>
                        </div>

                        <!-- Alert box for success/error feedback -->
                        <div id="form-alert" class="alert d-none" role="alert"></div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{{ url_for('auth_ui.classes_ui') }}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="bi bi-check-lg me-1"></i> Xác nhận thêm vào lớp
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript để tự động tải danh sách Lớp và Học sinh vào Dropdown -->
<script>
    document.addEventListener("DOMContentLoaded", async function() {
        await loadClassesDropdown();
        await loadStudentsDropdown();
    });

    // 1. Tải danh sách lớp học vào ô select
    async function loadClassesDropdown() {
        const classSelect = document.getElementById('class_id');
        try {
            const res = await fetch('/classes'); // Hoặc endpoint lấy danh sách lớp của bạn
            const result = await res.json();
            if (result.success && result.data.length > 0) {
                classSelect.innerHTML = '<option value="">-- Chọn lớp học --</option>' +
                    result.data.map(cls => `<option value="${cls.id}">${cls.class_name} (Sĩ số: ${cls.current_size || 0}/40)</option>`).join('');
            } else {
                classSelect.innerHTML = '<option value="">Không có lớp học nào</option>';
            }
        } catch (err) {
            console.error('Lỗi tải danh sách lớp:', err);
            classSelect.innerHTML = '<option value="">Lỗi tải dữ liệu lớp học</option>';
        }
    }

    // 2. Tải danh sách học sinh vào ô select
    async function loadStudentsDropdown() {
        const studentSelect = document.getElementById('student_id');
        try {
            const res = await fetch('/api/v1/students?limit=100');
            const result = await res.json();
            // Hỗ trợ cả cấu trúc trả về phân trang hoặc mảng trực tiếp
            const students = result.items || result.data || result;

            if (students && students.length > 0) {
                studentSelect.innerHTML = '<option value="">-- Chọn học sinh --</option>' +
                    students.map(s => `<option value="${s.id}">[${s.student_code}] ${s.full_name} - Sinh năm: ${s.date_of_birth || 'N/A'}</option>`).join('');
            } else {
                studentSelect.innerHTML = '<option value="">Không tìm thấy học sinh nào</option>';
            }
        } catch (err) {
            console.error('Lỗi tải danh sách học sinh:', err);
            studentSelect.innerHTML = '<option value="">Lỗi tải dữ liệu học sinh</option>';
        }
    }

    // 3. Xử lý submit form thêm học sinh vào lớp
    document.getElementById('addStudentToClassForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const classId = document.getElementById('class_id').value;
        const studentId = document.getElementById('student_id').value;
        const academicYearId = document.getElementById('academic_year_id').value;
        const alertEl = document.getElementById('form-alert');

        alertEl.classList.add('d-none');

        try {
            const response = await fetch(`/api/v1/classes/${classId}/enroll`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_id: parseInt(studentId),
                    academic_year_id: parseInt(academicYearId)
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                alertEl.className = 'alert alert-success';
                alertEl.textContent = result.message || 'Thêm học sinh vào lớp thành công!';
                alertEl.classList.remove('d-none');

                setTimeout(() => {
                    window.location.href = "{{ url_for('auth_ui.classes_ui') }}";
                }, 1500);
            } else {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = result.message || 'Không thể thêm học sinh (có thể lớp đã đạt sĩ số tối đa 40 - SD05).';
                alertEl.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error:', error);
            alertEl.className = 'alert alert-danger';
            alertEl.textContent = 'Lỗi kết nối đến máy chủ.';
            alertEl.classList.remove('d-none');
        }
    });
</script>
{% endblock %}
