{% extends 'layout/base.html' %}

{% block title %}Đăng ký tài khoản{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- REGISTER CARD -->
      <div class="card shadow-sm p-4">
        <h3 class="mb-3 text-success text-center">Register</h3>

        <!-- Optional error message display -->
        {% if err_msg %}
          <div class="alert alert-danger">{{ err_msg }}</div>
        {% endif %}

        <form method="POST" action="/register">

          <div class="mb-3">
            <label for="full_name" class="form-label">Full Name:</label>
            <input type="text" class="form-control" id="full_name" placeholder="Enter your full name" name="full_name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email address" name="email" required>
          </div>

          <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" id="username" placeholder="Choose username" name="username" required>
          </div>

          <div class="mb-3">
            <label for="pwd" class="form-label">Password:</label>
            <input type="password" class="form-control" id="pwd" placeholder="Choose password" name="password" required>
          </div>

          <div class="mb-3">
            <label for="confirm" class="form-label">Confirm Password:</label>
            <input type="password" class="form-control" id="confirm" placeholder="Confirm password" name="confirm" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number (Optional):</label>
            <input type="text" class="form-control" id="phone" placeholder="Enter phone number" name="phone">
          </div>

          <div class="mb-3">
            <label for="role" class="form-label">Role:</label>
            <select class="form-select" id="role" name="role">
              <option value="employee">Employee</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>

          <button type="submit" class="btn btn-success w-100">Register</button>
        </form>

        <!-- Link back to Login page -->
        <div class="text-center mt-3">
          <p class="text-muted mb-0">Already have an account? <a href="/login">Login here</a></p>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
