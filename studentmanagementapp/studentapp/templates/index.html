{% extends 'layout/base.html' %}

{% block title %}Trang chủ{% endblock %}

{% block content %}

<div class="container mt-4">
  <div class="p-5 mb-4 bg-light rounded-3 shadow-sm">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold text-primary">Welcome, {{ current_user.username }}!</h1>
      <p class="col-md-8 fs-4">You are logged in as <strong>{{ current_user.user_role.value }}</strong>.</p>
      <hr>
      <a href="/logout" class="btn btn-danger btn-lg">Logout</a>
    </div>
  </div>
</div>
{% endblock %}
